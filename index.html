<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet du Japon</title>
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
:root {
  --paper: #EDEFEA;
  --surface: #FAFBF8;
  --ink: #1B2230;
  --muted: #586172;
  --line: #D3D7CE;
  --hanko: #B8322A;
  --hanko-soft: rgba(184, 50, 42, .1);
  --tokyo: #2D4A7E;
  --kanazawa: #9A6E14;
  --kyoto: #8A2C44;
  --osaka: #1B7268;
  --nara: #557230;
  --fuji: #66548F;
  --escape: #84553A;
  --travel: #5F6776;
  --c: var(--ink);
  --radius-s: 6px;
  --radius-l: 14px;
  --scale: 1;
  --f-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151B; --surface: #1B1F27; --ink: #E6E7E1; --muted: #A2A9B6; --line: #2E3440;
    --hanko: #E2574C; --hanko-soft: rgba(226, 87, 76, .14);
    --tokyo: #8EA8E0; --kanazawa: #D9AE52; --kyoto: #E07C93; --osaka: #5CC2B4; --nara: #9EC26A; --fuji: #B3A2E0; --escape: #D49A77; --travel: #A3AAB8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151B; --surface: #1B1F27; --ink: #E6E7E1; --muted: #A2A9B6; --line: #2E3440;
  --hanko: #E2574C; --hanko-soft: rgba(226, 87, 76, .14);
  --tokyo: #8EA8E0; --kanazawa: #D9AE52; --kyoto: #E07C93; --osaka: #5CC2B4; --nara: #9EC26A; --fuji: #B3A2E0; --escape: #D49A77; --travel: #A3AAB8;
  color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); -webkit-text-size-adjust: 100%; font-size: calc(16px * var(--scale)); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--c, var(--tokyo)); outline-offset: 2px; border-radius: 4px; }
img { max-width: 100%; display: block; }
.c-tokyo { --c: var(--tokyo); } .c-kanazawa { --c: var(--kanazawa); } .c-kyoto { --c: var(--kyoto); }
.c-osaka { --c: var(--osaka); } .c-nara { --c: var(--nara); } .c-fuji { --c: var(--fuji); }
.c-escape { --c: var(--escape); } .c-travel { --c: var(--travel); }

/* En-tête */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.top-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; }
.top h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 0; letter-spacing: .01em; }
.clocks { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); line-height: 1.25; text-align: right; }
.clocks b { display: block; color: var(--ink); font-size: .95rem; font-variant-numeric: tabular-nums; font-weight: 700; }
.icon-btn { background: none; border: 0; padding: 8px; border-radius: 50%; cursor: pointer; color: var(--muted); display: grid; place-items: center; min-width: 40px; min-height: 40px; }
.icon-btn:hover { color: var(--ink); }

main { max-width: 680px; margin: 0 auto; padding: 18px 18px calc(110px + env(safe-area-inset-bottom, 0px)); }

/* Navigation basse */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button {
  background: none; border: 0; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .7rem; color: var(--muted); cursor: pointer; position: relative;
}
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--hanko); border-radius: 0 0 3px 3px; }

/* Typo */
h2.view-title { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.2; margin: 6px 0 4px; font-weight: 700; }
h3 { font-family: var(--f-display); font-size: 1.25rem; margin: 28px 0 10px; line-height: 1.3; }
h4 { font-size: 1rem; margin: 0 0 4px; line-height: 1.35; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.jp { font-family: var(--f-display); }
.lead { font-size: 1.05rem; max-width: 62ch; }
.prose p { max-width: 64ch; }

/* Chips et onglets */
.scroller { display: flex; gap: 8px; overflow-x: auto; padding: 2px 18px 10px; margin: 0 -18px; scrollbar-width: none; scroll-snap-type: x proximity; }
.scroller::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; font-size: .92rem; white-space: nowrap; scroll-snap-align: start;
  min-height: 40px; display: inline-flex; align-items: center; gap: 6px;
}
.chip .jp { font-size: .85rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--surface); }
.chip[aria-pressed="true"] .jp { color: inherit; opacity: .8; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 -18px 18px; padding: 0 18px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; background: none; border: 0; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: .95rem; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--c, var(--hanko)); font-weight: 700; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 16px; margin-bottom: 12px; }
.card.flat { border-radius: var(--radius-s); }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); padding: 8px 14px; cursor: pointer; font-size: .9rem; min-height: 40px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
.btn.accent { background: var(--c); color: var(--surface); border-color: var(--c); font-weight: 700; }
.btn.small { padding: 5px 11px; min-height: 34px; font-size: .82rem; }
.btn.danger { color: var(--hanko); border-color: var(--hanko); }
.btn svg { width: 18px; height: 18px; }

/* Ville : bandeau */
.city-head { position: relative; padding: 14px 0 4px; margin-bottom: 10px; overflow: hidden; }
.city-head .kanji {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-family: var(--f-display); font-weight: 700;
  font-size: 4.4rem; line-height: 1; color: var(--c); opacity: .16; pointer-events: none; white-space: nowrap;
}
.city-head h2, .city-head .city-dates { position: relative; }
.city-head h2 { color: var(--c); font-size: 2.4rem; }
.city-dates { font-size: .9rem; color: var(--muted); margin-bottom: 12px; }
details.fold { border-top: 1px solid var(--line); }
details.fold:last-of-type { border-bottom: 1px solid var(--line); }
details.fold > summary { list-style: none; cursor: pointer; padding: 13px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 1.3rem; color: var(--muted); font-weight: 400; }
details.fold[open] > summary::after { content: "−"; }
details.fold > div { padding-bottom: 14px; }

/* Lieux */
.place { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.place h4 { font-size: 1.05rem; }
.place .jp-name { font-family: var(--f-display); color: var(--muted); font-size: .92rem; }
.place .body { grid-column: 1 / -1; }
.meta { font-size: .88rem; padding: 8px 10px; border-radius: var(--radius-s); background: var(--paper); margin-top: 8px; }
.meta + .meta { margin-top: 6px; }
.meta strong { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; margin-bottom: 1px; }
.meta.acc { border-left: 3px solid var(--c); }
.place-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.stamp-btn { background: none; border: 0; padding: 0; cursor: pointer; width: 64px; height: 64px; border-radius: 50%; position: relative; }
.stamp-btn .hint { position: absolute; inset: 0; display: grid; place-items: center; font-size: .66rem; color: var(--muted); text-align: center; line-height: 1.15; border: 1.5px dashed var(--line); border-radius: 50%; padding: 6px; }
.stamp { width: 100%; height: 100%; display: block; }
.stamp.pressed { animation: press .45s cubic-bezier(.2,.9,.3,1.2); }
@keyframes press { 0% { transform: scale(1.6) rotate(-14deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@media (prefers-reduced-motion: reduce) { .stamp.pressed { animation: none; } }

.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-plain li:last-child { border-bottom: 0; }
.bul { padding-left: 1.1em; margin: 0; }
.bul li { margin-bottom: 6px; }

/* Hôtel */
.hotel { border-left: 4px solid var(--c); }
.hotel .addr-jp { font-family: var(--f-display); font-size: 1.05rem; }

/* Planning */
.day { display: grid; grid-template-columns: 58px 1fr; gap: 0 12px; position: relative; }
.day-date { text-align: center; padding-top: 12px; }
.day-date .dn { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; line-height: 1; display: block; }
.day-date .dw { font-size: .75rem; color: var(--muted); display: block; margin-top: 3px; }
.day-card { border-left: 4px solid var(--c); background: var(--surface); border-radius: 0 var(--radius-l) var(--radius-l) 0; margin-bottom: 10px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day-card > button { width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer; display: block; }
.day-card .city-tag { font-size: .78rem; color: var(--c); font-weight: 700; }
.day-card h4 { font-size: 1.05rem; margin: 1px 0 0; }
.day.today .day-date .dn { color: var(--hanko); }
.day.today .day-card { box-shadow: 0 0 0 2px var(--hanko-soft); }
.day.past { opacity: .72; }
.badge { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 999px; background: var(--hanko-soft); color: var(--hanko); font-weight: 700; margin-left: 6px; vertical-align: 2px; }
.day-body { padding: 0 14px 14px; }
.sched { list-style: none; margin: 0; padding: 0; }
.sched li { display: grid; grid-template-columns: 30px 50px 1fr; gap: 6px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.sched li.done .txt { text-decoration: line-through; color: var(--muted); }
.sched .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .9rem; padding-top: 2px; }
.sched input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--c); }
.place-link { background: none; border: 0; padding: 0; color: var(--c); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; text-align: left; }
.tips { margin-top: 10px; font-size: .9rem; }
.tips li { margin-bottom: 4px; }
textarea, input[type="text"], input[type="number"], input[type="date"], select {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-s); background: var(--paper); padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: .85rem; font-weight: 700; margin-bottom: 4px; }

/* Aujourd'hui */
.hero-day { padding: 6px 0 4px; }
.hero-day .count { font-family: var(--f-display); font-size: 1rem; color: var(--muted); }
.hero-day h2 { font-size: 2.1rem; margin: 2px 0 2px; }
.hero-day .where { color: var(--c); font-weight: 700; }
.daynav { display: flex; justify-content: space-between; margin: 10px 0 14px; }
.conv { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.conv input { text-align: right; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check input { width: 22px; height: 22px; margin-top: 1px; flex: 0 0 auto; accent-color: var(--hanko); }
.check.done span { color: var(--muted); text-decoration: line-through; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.progress > i { display: block; height: 100%; background: var(--hanko); }

/* Phrases */
.phrase { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.phrase .fr { font-weight: 700; }
.phrase .ja { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.4; }
.phrase .ro { color: var(--muted); font-size: .9rem; font-style: italic; }
.phrase .acts { grid-row: 1 / span 3; grid-column: 2; display: flex; flex-direction: column; gap: 6px; }

/* Plein écran « Montrer » */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 16px) 22px calc(env(safe-area-inset-bottom, 0px) + 22px); overflow-y: auto; }
.overlay .close { align-self: flex-end; }
.show-big { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; }
.show-big .ja { font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 9vw, 3.6rem); line-height: 1.35; word-break: break-word; }
.show-big .ja.long { font-size: clamp(1.6rem, 7vw, 2.6rem); }
.show-big .sub { font-family: var(--f-display); font-size: 1.3rem; }
.show-big .fr { color: var(--muted); }
.sheet { position: fixed; inset: 0; z-index: 45; background: rgba(10, 12, 16, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-in { background: var(--surface); width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); }
.sheet-in h3 { margin-top: 0; }

/* Carnet */
.entry { border-left: 4px solid var(--c); }
.entry .when { font-size: .82rem; color: var(--muted); }
.entry .mood { font-size: 1.4rem; }
.entry .text { white-space: pre-wrap; margin-top: 8px; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.photos img, .photos .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-s); background: var(--line); }
.photo-thumb { position: relative; }
.photo-thumb button { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; }
.pick { display: flex; gap: 6px; flex-wrap: wrap; }
.pick button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 10px; font-size: 1.2rem; cursor: pointer; min-width: 44px; min-height: 44px; }
.pick button[aria-pressed="true"] { border-color: var(--hanko); background: var(--hanko-soft); }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 14px 10px; }
.stamps .cell { text-align: center; font-size: .72rem; line-height: 1.25; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.stamps .cell .slot { width: 72px; height: 72px; margin: 0 auto 4px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; }
.stamps .cell .slot.on { border: 0; }
.stamps .cell .slot .jp { font-size: 1rem; color: var(--line); }
.stamp-count { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; color: var(--hanko); font-weight: 700; min-width: 1.2em; text-align: center; }
.exp { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.exp .amt { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.exp .sub { font-size: .8rem; color: var(--muted); }
.total { display: flex; justify-content: space-between; font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; padding: 12px 0; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 60; max-width: 90vw; text-align: center; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
.empty .jp { font-size: 2.2rem; color: var(--line); display: block; margin-bottom: 6px; }
.food { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.food .ja { font-family: var(--f-display); font-size: 1.15rem; grid-row: 1 / span 2; min-width: 4.5em; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.words div { background: var(--paper); border-radius: var(--radius-s); padding: 8px 10px; }
.words .ja { font-family: var(--f-display); font-size: 1.2rem; display: block; }
.era { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.era .yr { font-size: .8rem; color: var(--muted); }
.era h4 { font-family: var(--f-display); font-size: 1.05rem; }
.tel { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; color: var(--hanko); text-decoration: none; }

/* Impression du carnet */
@media print {
  .top, .nav, .no-print { display: none !important; }
  .book-open main { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; max-width: none; }
  .overlay { position: static; padding: 0; }
  .entry { break-inside: avoid; }
}

/* Tampons à collectionner */
.cstamp { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; margin: 8px 0; }
.cstamp.got { border-color: var(--hanko); background: var(--hanko-soft); }
.cs-seal { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--line); background: var(--paper); display: grid; place-items: center; padding: 0; cursor: pointer; color: var(--muted); }
.cs-seal[aria-pressed="true"] { border: none; background: transparent; }
.cs-seal .hint { font-size: .78rem; line-height: 1.1; text-align: center; padding: 4px; }
.cs-seal .stamp { width: 64px; height: 64px; }
.cs-kind { font-size: .8rem; color: var(--muted); }
.cs-name { font-weight: 700; margin: 2px 0; }
.cs-name .jp-name { font-weight: 400; font-size: .9rem; color: var(--muted); }
.cstamp .place-actions { margin-top: 8px; }

</style>

  function compress(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1400;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(u);
        cv.toBlob(b => b ? res(b) : rej(new Error("compression")), "image/jpeg", 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("image illisible")); };
      img.src = u;
    });
  }
  const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
  const dataURLToBlob = async d => (await fetch(d)).blob();

    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /^ja/i.test(x.lang));
    if (!v && voices.length) toast("Aucune voix japonaise installée : ajoutez-en une dans les réglages du téléphone.");
    const u = new SpeechSynthesisUtterance(text.replace(/[…]/g, "、"));
    u.lang = "ja-JP"; u.rate = 0.85; if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);

          <div class="row wrap" style="margin:8px 0"><span>Taille du texte</span><button class="btn small" data-act="scale" data-d="-0.1" aria-label="Réduire le texte">A−</button><button class="btn small" data-act="scale" data-d="0.1" aria-label="Agrandir le texte">A+</button></div>

  /* ---------- Éditeurs ---------- */
  let draft = null;

    const isNew = !e;
    draft = e ? JSON.parse(JSON.stringify(e)) : { id: uid(), date: todayISO(), time: new Date().toTimeString().slice(0, 5), city: "", quarter: "", mood: "", weather: "", text: "", photos: [], geo: null };
    if (isNew) {
      const dd = DAYS.find(d => d.d === draft.date);
      if (dd && CITY[dd.city]) draft.city = dd.city;
      if (draft.date < TRIP_START || draft.date > TRIP_END) draft.date = draft.date < TRIP_START ? TRIP_START : TRIP_END;
    }
    renderEntrySheet(isNew);
  }
  function renderEntrySheet(isNew) {
    const c = CITY[draft.city];

      <div class="row"><label class="field" style="flex:1"><span>Date</span><input type="date" id="en-date" value="${esc(draft.date)}"></label><label class="field" style="width:120px"><span>Heure</span><input type="text" id="en-time" value="${esc(draft.time || "")}" inputmode="numeric" placeholder="14:30"></label></div>

      <label class="field" style="flex:1"><span>Quartier</span><select id="en-quarter"><option value="">—</option>${c ? c.quarters.map(q => `<option value="${q.id}" ${q.id === draft.quarter ? "selected" : ""}>${esc(q.n)}</option>`).join("") : ""}</select></label></div>

  function openBook() {
    closeOverlay();

      <div style="max-width:680px;margin:0 auto;width:100%">
      <div style="text-align:center;padding:30px 0 20px"><div class="jp" lang="ja" style="font-size:3.4rem;color:var(--hanko);line-height:1">日本の旅</div><h2 class="view-title">Carnet de voyage au Japon</h2><p class="muted">Du 6 au 28 novembre 2026. ${S.entries.length} pages, ${nv} tampons.</p></div>`;

      if (S.dayNotes[day.d]) h += `<p class="muted small" style="white-space:pre-wrap">${esc(S.dayNotes[day.d])}</p>`;
      h += ents.map(entryHTML).join("") + `</section>`;
    });
    if (!S.entries.length && !nv) h += `<div class="empty">Le carnet se remplira au fil de vos pages et de vos tampons.</div>`;
    h += `</div>`;
    o.innerHTML = h;

  /* ---------- Export / import ---------- */
  async function exportData() {
    const ids = [];
    S.entries.forEach(e => (e.photos || []).forEach(id => ids.push(id)));
    const photos = {};
    for (const id of ids) { const b = await getPhoto(id); if (b) photos[id] = await blobToDataURL(b); }
    const data = JSON.stringify({ app: "carnet-japon", exported: new Date().toISOString(), state: S, photos });
    const blob = new Blob([data], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "carnet-japon-" + isoOf(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Sauvegarde exportée.");
  }
  async function importData(file) {
    try {
      const j = JSON.parse(await file.text());
      if (j.app !== "carnet-japon" || !j.state) throw new Error("format");
      for (const [id, d] of Object.entries(j.photos || {})) await putPhoto(id, await dataURLToBlob(d));
      S = Object.assign(defaults(), j.state); S.nav = Object.assign(defaults().nav, j.state.nav || {});
      save(); applyPrefs(); render(); toast("Sauvegarde importée.");
    } catch (e) { toast("Ce fichier n’est pas une sauvegarde du carnet."); }
  }

  /* ---------- Rendu ---------- */
  const TITLES = { today: "Aujourd’hui", plan: "Planning", cities: "Villes", japan: "Le Japon", book: "Mon carnet" };
  function render(keepScroll) {
    const y = window.scrollY;
    const tab = S.nav.tab;
    $("#title").textContent = TITLES[tab];
    const m = $("#main");
    m.innerHTML = tab === "today" ? viewToday() : tab === "plan" ? viewPlan() : tab === "cities" ? viewCities() : tab === "japan" ? viewJapan() : viewBook();
    document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    hydratePhotos(m);
    if (keepScroll) window.scrollTo(0, y);
  }
  function go(tab, extra) {
    S.nav.tab = tab; Object.assign(S.nav, extra || {}); save(); render(); window.scrollTo(0, 0);
  }
  function applyPrefs() {
    document.documentElement.style.setProperty("--scale", S.scale);
    if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme);
  }
  function clocks() {
    const o = { hour: "2-digit", minute: "2-digit" };
    try {
      $("#clk-jp").textContent = new Date().toLocaleTimeString("fr-FR", Object.assign({ timeZone: "Asia/Tokyo" }, o));
      $("#clk-fr").textContent = new Date().toLocaleTimeString("fr-FR", Object.assign({ timeZone: "Europe/Paris" }, o));
    } catch (e) { /* rien */ }
  }

  /* ---------- Événements ---------- */
  document.addEventListener("click", async ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const a = el.dataset.act, d = el.dataset;
    if (el.tagName === "INPUT" && el.type === "checkbox") return;
    switch (a) {
      case "tab": go(d.tab); break;
      case "goto": go(d.tab, d.ctab ? { ctab: d.ctab } : {}); break;
      case "city": S.nav.city = d.id; save(); render(); window.scrollTo(0, 0); break;
      case "quarter": S.nav.quarter[S.nav.city] = d.id; save(); render(true); break;
      case "jtab": S.nav.jtab = d.k; save(); render(true); break;
      case "ctab": S.nav.ctab = d.k; save(); render(true); break;
      case "plan-filter": S.nav.planFilter = d.c; save(); render(true); break;
      case "open-day": { const i = +d.i; S.nav.openDay = S.nav.openDay === i ? null : i; save(); render(true); break; }
      case "today-step": { const base = S.nav.todayView != null ? S.nav.todayView : Math.max(0, Math.min(DAYS.length - 1, daysBetween(TRIP_START, todayISO()))); S.nav.todayView = Math.max(0, Math.min(DAYS.length - 1, base + Number(d.d))); save(); render(); break; }
      case "today-reset": S.nav.todayView = null; save(); render(); break;
      case "preview-day": S.nav.todayView = +d.i; save(); render(); window.scrollTo(0, 0); break;
      case "go-place": {
        const x = PLACES[d.id]; if (!x) break;
        S.nav.tab = "cities"; S.nav.city = x.c.id; S.nav.quarter[x.c.id] = x.q.id; save(); closeOverlay(); render();
        const t = document.getElementById("pl-" + d.id);
        if (t) { t.scrollIntoView({ block: "start" }); t.style.boxShadow = "0 0 0 3px var(--c)"; setTimeout(() => { t.style.boxShadow = ""; }, 1600); }
        break;
      }
      case "collect": {
        if (S.collect[d.id]) { if (!confirm("Retirer ce tampon de votre collection ?")) break; delete S.collect[d.id]; save(); render(true); break; }
        S.collect[d.id] = { d: todayISO() }; save(); render(true);
        const s = document.querySelector(`[data-act="collect"][data-id="${CSS.escape(d.id)}"] .stamp`);
        if (s) s.classList.add("pressed");
        if (navigator.vibrate) navigator.vibrate(30);
        break;
      }
      case "stab": S.nav.stab = d.k; save(); render(true); break;
      case "go-quarter": {
        const x = QUARTER[d.q]; if (!x) break;
        S.nav.tab = "cities"; S.nav.city = x.c.id; S.nav.quarter[x.c.id] = x.q.id; save(); closeOverlay(); render();
        const t = document.getElementById("cs-" + d.id);
        if (t) { t.scrollIntoView({ block: "center" }); t.style.boxShadow = "0 0 0 3px var(--c)"; setTimeout(() => { t.style.boxShadow = ""; }, 1600); }
        break;
      }
      case "add-mystamp": {
        const x = QUARTER[d.q]; if (!x) break;
        sheet(`<h3>Ajouter un tampon</h3><p class="small muted">${esc(x.c.n)}, ${esc(x.q.n)}</p>
          <label class="field"><span>Nom du lieu</span><input type="text" id="ms-n" placeholder="ex. Gare d’Okachimachi"></label>
          <label class="field"><span>Nom en japonais (facultatif)</span><input type="text" id="ms-jp" lang="ja"></label>
          <label class="field"><span>Type</span><select id="ms-k">${Object.entries(STAMP_KINDS).map(([k, K]) => `<option value="${k}">${K.ico} ${esc(K.n)}</option>`).join("")}</select></label>
          <label class="field"><span>Où se trouve-t-il ? (facultatif)</span><input type="text" id="ms-where"></label>
          <label class="check"><input type="checkbox" id="ms-got" checked><span>Je l’ai déjà récupéré</span></label>
          <div class="row wrap" style="margin-top:10px"><button class="btn primary" data-act="save-mystamp" data-q="${esc(d.q)}">Ajouter</button><button class="btn" data-act="close">Annuler</button></div>`, "Ajouter un tampon");
        break;
      }
      case "save-mystamp": {
        const n = ($("#ms-n") || {}).value || ""; if (!n.trim()) { toast("Indiquez au moins le nom du lieu."); break; }
        const id = "m-" + uid();
        S.myStamps = S.myStamps || [];
        S.myStamps.push({ id, q: d.q, k: $("#ms-k").value, n: n.trim(), jp: $("#ms-jp").value.trim(), where: $("#ms-where").value.trim() });
        if ($("#ms-got").checked) S.collect[id] = { d: todayISO() };
        save(); closeOverlay(); render(true); toast("Tampon ajouté.");
        break;
      }
      case "del-mystamp": {
        if (!confirm("Supprimer ce tampon que vous aviez ajouté ?")) break;
        S.myStamps = (S.myStamps || []).filter(x => x.id !== d.id); delete S.collect[d.id]; save(); render(true);
        break;
      }
      case "stamp": {
        if (S.visited[d.id]) { if (!confirm("Retirer ce tampon ?")) break; delete S.visited[d.id]; save(); render(true); break; }
        S.visited[d.id] = todayISO(); save(); render(true);
        const s = document.querySelector(`[data-act="stamp"][data-id="${CSS.escape(d.id)}"] .stamp`);
        if (s) s.classList.add("pressed");
        if (navigator.vibrate) navigator.vibrate(30);
        break;
      }
      case "show": showBig(d.ja, d.sub || "", d.fr || ""); break;
      case "speak": speak(d.text); break;
      case "close": closeOverlay(); break;
      case "print": window.print(); break;
      case "book": openBook(); break;
      case "show-hotel": {
        const h = getHotel(d.key); if (!h) break;
        showBig(h.addrJp || h.jp, h.addrJp ? h.jp : "", "Cet hôtel, s’il vous plaît : この住所までお願いします");
        break;
      }
      case "edit-hotel": editHotel(d.key); break;
      case "save-hotel": {
        const v = id => $("#" + id).value.trim();
        const h = { n: v("ho-n") || "Mon hôtel", jp: v("ho-jp"), addr: v("ho-addr"), addrJp: v("ho-addrjp"), tel: v("ho-tel"), note: v("ho-note") };
        S.hotels[d.key] = h; save(); closeOverlay(); render(true); toast("Hôtel enregistré.");
        break;
      }
      case "new-entry": {
        openEntry(null);
        if (d.date) { draft.date = d.date; if (d.city && CITY[d.city]) draft.city = d.city; renderEntrySheet(true); }
        break;
      }
      case "edit-entry": { const e = S.entries.find(x => x.id === d.id); if (e) openEntry(e); break; }
      case "pick": readDraft(); draft[d.f] = draft[d.f] === d.v ? "" : d.v; el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el && draft[d.f] ? "true" : "false")); break;
      case "rm-photo": readDraft(); draft.photos = draft.photos.filter(x => x !== d.id); el.parentElement.remove(); break;
      case "geo": {
        readDraft();
        if (!navigator.geolocation) { toast("La localisation n’est pas disponible."); break; }
        el.disabled = true; el.textContent = "Localisation…";
        navigator.geolocation.getCurrentPosition(p => { draft.geo = { lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5) }; el.disabled = false; el.textContent = "Position enregistrée, actualiser"; toast("Position ajoutée."); },
          () => { el.disabled = false; el.textContent = "Ajouter ma position"; toast("Position introuvable : vérifiez l’autorisation de localisation."); }, { enableHighAccuracy: true, timeout: 15000 });
        break;
      }
      case "save-entry": {
        readDraft();
        const old = S.entries.find(x => x.id === draft.id);
        if (old) { (old.photos || []).filter(p => !draft.photos.includes(p)).forEach(delPhoto); Object.assign(old, draft); }
        else S.entries.push(draft);
        save(); closeOverlay(); render(true); toast("Page enregistrée dans le carnet.");
        break;
      }
      case "del-entry": {
        if (!confirm("Supprimer cette page et ses photos ?")) break;
        const e = S.entries.find(x => x.id === draft.id);
        if (e) (e.photos || []).forEach(delPhoto);
        S.entries = S.entries.filter(x => x.id !== draft.id); save(); closeOverlay(); render(true);
        break;
      }
      case "add-exp": {
        const y = parseFloat($("#exp-yen").value);
        if (!y) { toast("Indiquez un montant en yens."); break; }
        S.expenses.push({ id: uid(), date: todayISO(), yen: y, cat: $("#exp-cat").value, label: $("#exp-label").value.trim() });
        save(); render(true); break;
      }
      case "del-exp": S.expenses = S.expenses.filter(x => x.id !== d.id); save(); render(true); break;
      case "scale": S.scale = Math.max(0.85, Math.min(1.4, Math.round((S.scale + Number(d.d)) * 100) / 100)); applyPrefs(); save(); break;
      case "theme": S.theme = d.k; applyPrefs(); save(); render(true); break;
      case "export": exportData(); break;
      case "reset": {
        if (!confirm("Effacer définitivement le journal, les photos, les tampons et les notes ?")) break;
        S.entries.forEach(e => (e.photos || []).forEach(delPhoto));
        const nav = S.nav; S = defaults(); S.nav = Object.assign(nav, { tab: "today", todayView: null });
        save(); applyPrefs(); render(); toast("Données effacées.");
        break;
      }
    }
  });

  document.addEventListener("change", async ev => {
    const el = ev.target;
    if (el.dataset.act === "toggle-done") { if (el.checked) S.done[el.dataset.k] = true; else delete S.done[el.dataset.k]; el.closest("li").classList.toggle("done", el.checked); save(); }
    if (el.dataset.act === "toggle-prep") { if (el.checked) S.prep[el.dataset.i] = true; else delete S.prep[el.dataset.i]; save(); render(true); }
    if (el.id === "en-city") { readDraft(); draft.quarter = ""; const c = CITY[draft.city]; $("#en-quarter").innerHTML = `<option value="">—</option>` + (c ? c.quarters.map(q => `<option value="${q.id}">${esc(q.n)}</option>`).join("") : ""); }
    if (el.id === "en-files") {
      readDraft();
      const files = Array.from(el.files || []);
      const box = $("#en-photos");
      for (const f of files) {
        try {
          const b = await compress(f); const id = "ph-" + uid();
          await putPhoto(id, b); draft.photos.push(id);
          const div = document.createElement("div"); div.className = "photo-thumb";
          div.innerHTML = `<img data-photo="${id}" alt="Photo"><button data-act="rm-photo" data-id="${id}" aria-label="Retirer la photo">×</button>`;
          box.appendChild(div); hydratePhotos(div);
        } catch (e) { toast("Une photo n’a pas pu être ajoutée."); }
      }
      el.value = "";
    }
    if (el.id === "set-rate") { const r = parseFloat(el.value); if (r > 0) { S.rate = r; save(); toast("Taux enregistré."); } }
    if (el.id === "set-sim") { S.simDate = el.value || ""; S.nav.todayView = null; save(); toast(el.value ? "Date de test : " + longDate(el.value) : "Retour à la vraie date."); }
    if (el.id === "import-file" && el.files[0]) importData(el.files[0]);
  });

  document.addEventListener("input", ev => {
    const el = ev.target;
    if (el.dataset.note) { if (el.value.trim()) S.dayNotes[el.dataset.note] = el.value; else delete S.dayNotes[el.dataset.note]; save(); }
    if (el.id === "conv-yen") { const v = parseFloat(el.value); $("#conv-eur").value = v ? (v / S.rate).toFixed(2) : ""; }
    if (el.id === "conv-eur") { const v = parseFloat(el.value); $("#conv-yen").value = v ? Math.round(v * S.rate) : ""; }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeOverlay(); });

  /* ---------- Démarrage ---------- */
  document.querySelectorAll(".nav button").forEach(b => { b.innerHTML = I[b.dataset.icon] + "<span>" + b.dataset.label + "</span>"; });
  $("#settings-btn").innerHTML = I.gear;
  applyPrefs(); render(); clocks(); setInterval(clocks, 30000);
  if ("serviceWorker" in navigator && /^https:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* pas de mode hors ligne ici */ });
  }
})();

</script>
</body>
</html>
